
name: Build BSA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: bsa-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build BSA Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Ambil source code repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Siapkan Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Siapkan Android SDK (v4)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. Instal Android SDK 35
      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Siapkan Gradle 8.9
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Periksa file proyek
      - name: Verify Android project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "BSA Android project ready."

      # 7. Build APK
      - name: Build Debug APK
        run: |
          gradle --no-daemon clean assembleDebug --stacktrace

      # 8. Periksa hasil APK
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      # 9. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BSA-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
