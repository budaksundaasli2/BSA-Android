<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSA </title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Amaranth:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
    <div id="editor">
        <img id="background"/>
        <div class="gradient top-gradient"></div>
        <div class="gradient bottom-gradient"></div>
        <div id="text" contenteditable="true" spellcheck="false">Ketikan<br>Status</div>
        <img id="logo" src="logo-bsa.png" alt="Logo BSA" />
    </div>

    <div class="controls">
        <label for="bgInput">Pilih Gambar Latar Belakang:</label>
        <div class="upload-row">
            <input type="file" accept="image/*" id="bgInput" />
            <div class="camera-actions">
                <button type="button" id="openCameraBtn">📷 Ambil Foto</button>
                <input type="file" id="cameraCaptureInput" accept="image/*" capture="environment" hidden>
            </div>
        </div>

       
<div class="button-group">
    <button type="button" id="previewBtn">
        <svg viewBox="0 0 24 24" width="21" height="21"
             fill="none" stroke="currentColor"
             stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="m21 15-5-5L5 21"/>
        </svg>
        <span>Preview</span>
    </button>

    <button type="button" id="navHome">
        <svg viewBox="0 0 24 24" width="21" height="21"
             fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round">
            <path d="m3 10 9-7 9 7"/>
            <path d="M5 9v12h14V9"/>
            <path d="M9 21v-7h6v7"/>
        </svg>
        <span>Home</span>
    </button>

    <button type="button" id="saveBtn">
        <svg viewBox="0 0 24 24" width="21" height="21"
             fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <path d="m7 10 5 5 5-5"/>
            <path d="M12 15V3"/>
        </svg>
        <span>Unduh</span>
    </button>
</div>

    <!-- Modal Kamera -->
    <div id="cameraModal" class="modal camera-modal" aria-hidden="true">
        <div class="camera-content">
            <video id="cameraVideo" autoplay playsinline muted></video>
            <p id="cameraMessage" class="camera-message">Arahkan kamera, lalu ambil foto.</p>
            <div class="camera-buttons">
                <button type="button" id="switchCameraBtn">🔄 Ganti Kamera</button>
                <button type="button" id="capturePhotoBtn">📸 Jepret</button>
                <button type="button" id="closeCameraBtn">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Modal untuk Crop -->
    <div id="cropModal" class="modal">
        <div class="modal-content">
            <div id="cropContainer">
                <img id="cropImage" src="" alt="Gambar untuk di-crop">
            </div>
            <div class="crop-buttons">
                <button id="cropBtn">Crop</button>
                <button id="cancelCropBtn">Batal</button>
            </div>
        </div>
    </div>

    <!-- Modal untuk Preview -->
    <div id="previewModal" class="modal">
        <div class="preview-content">
            <img id="previewImage" src="" alt="Preview">
            <div class="preview-buttons">
                <button id="downloadBtn">Unduh</button>
                <button id="cancelPreviewBtn">Batal</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=20261031-bsa12"></script>
    <footer class="footer">
  &copy; 2026 Budak Sunda Asli. All rights reserved.
</footer>
</body>
</html>
