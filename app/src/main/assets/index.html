<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSA </title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Amaranth:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20261102-bsa-home-fix3">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
    <div id="editor">
        <img id="background"/>
        <div class="gradient top-gradient"></div>
        <div class="gradient bottom-gradient"></div>
        <div id="text" contenteditable="true" spellcheck="false">Ketikan<br>Status</div>
        <img id="logo" src="logo-bsa.png" alt="Logo BSA" />
    </div>

    <div class="controls">
        <label for="bgInput">Pilih Gambar Latar Belakang:</label>
        <div class="upload-row">
            <input type="file" accept="image/*" id="bgInput" />
            <div class="camera-actions">
                <button type="button" id="openCameraBtn">Ambil Foto</button>
                <input type="file" id="cameraCaptureInput" accept="image/*" capture="environment" hidden>
            </div>
        </div>
<section id="settingsPanel" class="settings-panel" hidden>
            <h2>Pengaturan BSA</h2>
            <p class="settings-gesture-hint">Geser ke kiri untuk menutup</p>
            <label class="setting-row" for="darkModeToggle">
                <span>Dark mode</span><input type="checkbox" id="darkModeToggle">
            </label>
            <label class="setting-row" for="watermarkToggle">
                <span>Watermark BSA</span><input type="checkbox" id="watermarkToggle" checked>
            </label>
            <label for="storageLocation">Lokasi penyimpanan</label>
            <select id="storageLocation" class="setting-select">
                <option value="internal">Internal</option>
                <option value="sdcard">SD Card</option>
            </select>
            <button type="button" id="chooseSdCardFolderBtn" class="settings-close" hidden>Pilih folder SD Card</button>
            <p id="storageDescription" class="setting-help">Hasil unduhan disimpan di penyimpanan internal aplikasi BSA.</p>
            <div class="setting-version">Versi BSA <strong id="appVersion">2.3</strong></div>
        </section>

        <div class="button-group" aria-label="Navigasi utama">
            <button id="previewBtn" type="button">Preview</button>
            <button id="saveBtn" type="button">Unduh</button>
        </div>
    </div>

    <!-- Modal Kamera -->
    <div id="cameraModal" class="modal camera-modal" aria-hidden="true">
        <div class="camera-content">
            <video id="cameraVideo" autoplay playsinline muted></video>
            <p id="cameraMessage" class="camera-message">Arahkan kamera, lalu ambil foto.</p>
            <div class="camera-buttons">
                <button type="button" id="switchCameraBtn">🔄 Ganti Kamera</button>
                <button type="button" id="capturePhotoBtn">📸 Jepret</button>
                <button type="button" id="closeCameraBtn">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Modal untuk Crop -->
    <div id="cropModal" class="modal">
        <div class="modal-content">
            <div id="cropContainer">
                <img id="cropImage" src="" alt="Gambar untuk di-crop">
            </div>
            <div class="crop-buttons">
                <button id="cropBtn">Crop</button>
                <button id="cancelCropBtn">Batal</button>
            </div>
        </div>
    </div>

    <!-- Modal untuk Preview -->
    <div id="previewModal" class="modal">
        <div class="preview-content">
            <img id="previewImage" src="" alt="Preview">
            <div class="preview-buttons">
                <button id="downloadBtn">Unduh</button>
                <button id="cancelPreviewBtn">Batal</button>
            </div>
        </div>
    </div>

    <nav class="bsa-bottom-nav" aria-label="Navigasi utama BSA">
        <button type="button" class="bsa-nav-item active" data-page="home"><span class="bsa-nav-icon">⌂</span><small>Home</small></button>
        <button type="button" class="bsa-nav-item" data-page="collection"><span class="bsa-nav-icon">▧</span><small>Koleksi</small></button>
        <button type="button" class="bsa-nav-item" data-page="settings"><span class="bsa-nav-icon">⚙</span><small>Pengaturan</small></button>
    </nav>
    <script src="script.js?v=20261102-bsa-home-reload"></script>
    <footer class="footer">
  &copy; 2026 Budak Sunda Asli. All rights reserved.
</footer>
</body>
</html>
